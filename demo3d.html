<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vélorne — scène de référence 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden;font-family:'Trebuchet MS',sans-serif;color:#f3ead2;touch-action:none;user-select:none;-webkit-user-select:none}
  #view{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #view.smooth{image-rendering:auto}
  #hud{position:fixed;left:10px;top:8px;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.4}
  #hud b{color:#ffe7a0}
  #bar{position:fixed;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
  #bar button{background:rgba(20,14,28,.72);color:#f3ead2;border:1px solid #c9a45a88;border-radius:8px;padding:6px 9px;font-size:12px}
  #bar button.on{background:#c9a45a;color:#1a120a}
  #aim{position:fixed;right:22px;bottom:26px;width:78px;height:78px;border-radius:50%;background:rgba(20,14,28,.6);border:2px solid #c9a45aaa;color:#ffe7a0;font-size:13px;display:flex;align-items:center;justify-content:center}
  #stick{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid #ffffff55;display:none;pointer-events:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffff66}
  #reticle{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:2px solid #fff;border-radius:50%;display:none;pointer-events:none;box-shadow:0 0 6px #000}
  #reticle:after{content:'';position:absolute;left:11px;top:11px;width:2px;height:2px;background:#fff}
  #help{position:fixed;left:10px;bottom:8px;font-size:11px;opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><b>Vélorne — scène de référence 3D</b><br><span id="fps"></span></div>
<div id="bar">
  <button id="bPix" class="on">Pixel 3D</button>
  <button id="bTime">Jour</button>
  <button id="bRain">Pluie</button>
  <button id="bRotL">⟲</button><button id="bRotR">⟳</button>
  <button id="bQual">Qualité : auto</button>
  <button onclick="location.href='index.html'">Retour au jeu</button>
</div>
<div id="aim">Viser</div>
<div id="stick"><div id="knob"></div></div>
<div id="reticle"></div>
<div id="help">ZQSD / flèches : marcher · clic droit ou « Viser » : visée immersive · molette : zoom · A/E : tourner la caméra</div>
<script type="module">
import * as THREE from './assets/demo/three.module.js';

// les pentes raides (falaise du plateau) prennent la couleur de la roche
{ const nrm = tg.attributes.normal; for (let i = 0; i < tp.count; i++) { const k = 1 - nrm.getY(i); if (k > 0.25) { const t = clamp((k - 0.25) * 3, 0, 1); tcol[i * 3] = lerp(tcol[i * 3], cRock.r, t); tcol[i * 3 + 1] = lerp(tcol[i * 3 + 1], cRock.g, t); tcol[i * 3 + 2] = lerp(tcol[i * 3 + 2], cRock.b, t); } } }

  for (let i = 0; i < 60; i++) { x.fillStyle = 'rgba(80,80,80,.35)'; x.fillRect(rnd() * 128, rnd() * 128, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(70, 70); t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; return t; }

terrain.receiveShadow = true; scene.add(terrain);
// eau de l'étang
const waterMat = new THREE.MeshPhongMaterial({ color: '#4f8fae', transparent: true, opacity: 0.78, shininess: 90, specular: '#cfefff' });
const water = new THREE.Mesh(new THREE.CircleGeometry(8, 40), waterMat); water.rotation.x = -Math.PI / 2; water.scale.set(1, 0.72, 1); water.position.set(13, WATER_Y, 6); water.receiveShadow = true; scene.add(water);

// ---------------------------------------------------------------- végétation, rochers, ruines (instanciés pour le mobile)
const colliders = []; // cercles {x,z,r}
const occluders = []; // matériaux à découper autour du joueur
const playerScreen = { value: new THREE.Vector2(0.5, 0.5) }, playerDepth = { value: 1 }, resU = { value: new THREE.Vector2(1, 1) };
function cutout(mat) { // découpe en damier les feuillages entre la caméra et le joueur (le joueur reste visible derrière les arbres)

    sh.uniforms.uPS = playerScreen; sh.uniforms.uPD = playerDepth; sh.uniforms.uRes = resU;
    sh.fragmentShader = 'uniform vec2 uPS; uniform float uPD; uniform vec2 uRes;\n' + sh.fragmentShader.replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
      { vec2 q = gl_FragCoord.xy / uRes; vec2 d = (q - uPS) * vec2(uRes.x / uRes.y, 1.0); float r = length(d);

  };

}

  let n = 0; geos.forEach(g => n += g.attributes.position.count);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3); let o = 0;
  for (const g of geos) { const p = g.attributes.position, nn = g.attributes.normal, c = g.attributes.color; for (let i = 0; i < p.count; i++) { pos.set([p.getX(i), p.getY(i), p.getZ(i)], (o + i) * 3); nor.set([nn.getX(i), nn.getY(i), nn.getZ(i)], (o + i) * 3); col.set([c.getX(i), c.getY(i), c.getZ(i)], (o + i) * 3); } o += p.count; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return g;

  for (let i = 0; i < p.count; i += 3) { const k = 1 + (rnd() - 0.5) * (vary || 0.2) + p.getY(i) * 0.04; for (let j = 0; j < 3; j++) { arr[(i + j) * 3] = c.r * k; arr[(i + j) * 3 + 1] = c.g * k; arr[(i + j) * 3 + 2] = c.b * k; } }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3)); return g; }
// arbre feuillu : tronc conique + grappes de feuillage
function broadleafGeo() {
  const parts = [paint(new THREE.CylinderGeometry(0.22, 0.42, 3.2, 7).translate(0, 1.6, 0), '#6b4a2e', 0.15)];
  for (let i = 0; i < 7; i++) { const a = rnd() * 6.28, r = i ? 0.9 + rnd() * 0.7 : 0; const s = i ? 1.0 + rnd() * 0.5 : 1.6;

  return merge(parts);
}
function pineGeo() { const parts = [paint(new THREE.CylinderGeometry(0.15, 0.3, 2, 6).translate(0, 1, 0), '#5a3c24', 0.1)];
  for (let i = 0; i < 4; i++) parts.push(paint(jitterGeo(new THREE.ConeGeometry(1.7 - i * 0.35, 1.9, 8), 0.12).translate(0, 2 + i * 1.05, 0), ['#2e5a32', '#36683a', '#2a5230', '#3c7040'][i], 0.25));
  return merge(parts); }
function bushGeo() { const parts = []; for (let i = 0; i < 5; i++) { const a = rnd() * 6.28, r = i ? 0.45 : 0; parts.push(paint(jitterGeo(new THREE.IcosahedronGeometry(0.55 + rnd() * 0.25, 1), 0.3).translate(Math.cos(a) * r, 0.45 + rnd() * 0.2, Math.sin(a) * r), ['#4f8a3a', '#5e9a44', '#447a33'][i % 3], 0.3)); }
  for (let i = 0; i < 6; i++) { const a = rnd() * 6.28; parts.push(paint(new THREE.IcosahedronGeometry(0.06, 0).translate(Math.cos(a) * 0.6, 0.55 + rnd() * 0.35, Math.sin(a) * 0.6), '#c43a4a', 0.1)); }
  return merge(parts); }
function rockGeo() { return paint(jitterGeo(new THREE.DodecahedronGeometry(1, 0), 0.35).scale(1, 0.62, 1), '#8f8a82', 0.25); }

const solidMat = new THREE.MeshLambertMaterial({ vertexColors: true });

for (let i = 0; i < 600 && bushes.length < 110; i++) { const x = (rnd() - 0.5) * 90, z = (rnd() - 0.5) * 90; if (!freeSpot(x, z, 2.2)) continue; if (colliders.some(c => Math.hypot(c.x - x, c.z - z) < 1.6)) continue; bushes.push({ x, z, s: 0.8 + rnd() * 0.7 }); }

  const pos = [...a.attributes.position.array, ...b.attributes.position.array], uv = [...a.attributes.uv.array, ...b.attributes.uv.array], nor = []; for (let i = 0; i < pos.length / 3; i++) nor.push(0, 1, 0);

const grassList = []; for (let i = 0; i < 20000 && grassList.length < 7000; i++) { const x = (rnd() - 0.5) * 80, z = (rnd() - 0.5) * 80; if (distPath(x, z) < 1.4 || pond(x, z) < -0.1) continue; if (Math.abs(heightAt(x, z) - heightAt(x + 0.5, z)) > 0.4) continue; grassList.push({ x, z, s: 0.7 + rnd() * 0.7 }); }

{ const g = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.09, 0).translate(0, 0.32, 0), new THREE.MeshLambertMaterial(), flowerList.length); const d = new THREE.Object3D(); const pal = ['#f2a3c6', '#ffffff', '#f6d65a', '#b98cf0', '#e8546a'];

const stoneMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const ruin = new THREE.Group(); scene.add(ruin);
function block(w, h, d, x, y, z, col, collide) { const g = paint(new THREE.BoxGeometry(w, h, d), col || '#9a968a', 0.25); const m = new THREE.Mesh(g, stoneMat); m.position.set(x, heightAt(x, z) + y + h / 2, z); m.castShadow = m.receiveShadow = true; ruin.add(m); if (collide) colliders.push({ x, z, r: Math.max(w, d) * 0.55 }); return m; }
// escalier de pierre (marches visibles sur la rampe)
for (let i = 0; i < 10; i++) { const z = STAIR.z0 - 0.3 - i * 0.6; const g = paint(new THREE.BoxGeometry(4.2, 0.32, 0.62), i % 2 ? '#a8a294' : '#9c968a', 0.15); const m = new THREE.Mesh(g, stoneMat); m.position.set(0, heightAt(0, z) - 0.1, z); m.castShadow = m.receiveShadow = true; ruin.add(m); }
block(0.6, 1.0, 6.4, -2.5, -0.2, -9, '#8c887c', true); block(0.6, 1.0, 6.4, 2.5, -0.2, -9, '#8c887c', true);
for (let i = 0; i < 3; i++) colliders.push({ x: -2.5, z: -6.8 - i * 2.2, r: 0.5 }, { x: 2.5, z: -6.8 - i * 2.2, r: 0.5 });
// arche ruinée
block(1.2, 4.2, 1.2, 1.5, 0, -24, '#9a968a', true); block(1.2, 3.2, 1.2, 6.5, 0, -27.5, '#9a968a', true); block(6.6, 0.9, 1.2, 4, 4.0, -25.6, '#a39e90').rotation.y = -0.6;
for (let i = 0; i < 6; i++) block(1.0, 0.6 + rnd() * 1.4, 0.8, -6 + i * 1.6, 0, -18 - rnd() * 0.6, '#8e8a7e', true);
block(0.9, 0.5, 0.9, 9, 0, -21, '#8e8a7e', true); block(0.7, 0.4, 0.7, -3, 0, -26, '#8e8a7e');
// piliers et torches (lumière chaude qui vacille)
const torches = [];
for (const [x, z] of [[-1.6, -14.5], [1.6, -14.5]]) { block(0.7, 1.6, 0.7, x, 0, z, '#8a8678', true); const l = new THREE.PointLight('#ffb35a', 3.2, 9, 1.6); l.position.set(x, heightAt(x, z) + 2.1, z); scene.add(l);
  const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 0), new THREE.MeshBasicMaterial({ color: '#ffd27a' })); f.position.copy(l.position); scene.add(f); torches.push({ l, f }); }
// cristaux lumineux
for (const [x, z] of [[-9, -20], [11, -16], [-14, 4]]) { const m = new THREE.Mesh(paint(jitterGeo(new THREE.OctahedronGeometry(0.6, 0), 0.3).scale(0.6, 1.4, 0.6), '#7fd8ff', 0.2), new THREE.MeshLambertMaterial({ vertexColors: true, emissive: '#2a8cc8', emissiveIntensity: 0.9 }));
  m.position.set(x, heightAt(x, z) + 0.7, z); scene.add(m); const l = new THREE.PointLight('#7fd8ff', 1.6, 6); l.position.set(x, heightAt(x, z) + 1.2, z); scene.add(l); colliders.push({ x, z, r: 0.6 }); }
// petite maison (élément architectural du village)
{ const x = -14, z = 18; const base = block(5, 2.6, 4, x, 0, z, '#d8c8a8', true); const roof = new THREE.Mesh(paint(new THREE.ConeGeometry(4.2, 2.4, 4).rotateY(Math.PI / 4).scale(1.25, 1, 1), '#8a3a2a', 0.15), stoneMat); roof.position.set(x, heightAt(x, z) + 3.8, z); roof.castShadow = true; ruin.add(roof);
  block(1, 1.6, 0.2, x + 0.6, 0, z + 2.05, '#5a3a20'); const win = new THREE.PointLight('#ffcf8a', 1.4, 5); win.position.set(x + 1.8, heightAt(x, z) + 1.6, z + 2.3); scene.add(win); colliders.push({ x: x - 1.5, z, r: 2.4 }, { x: x + 1.5, z, r: 2.4 }); }

// ---------------------------------------------------------------- personnage pixel art (panneau orienté vers la caméra)
const loader = new THREE.TextureLoader();
const sheets = {};
function loadSheet(name, cols) { const t = loader.load('assets/demo/hero_' + name + '.png'); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; t.repeat.set(1 / cols, 1 / 4); sheets[name] = { t, cols }; return t; }
loadSheet('walk', 9); loadSheet('idle', 2);
const heroMat = new THREE.MeshLambertMaterial({ map: sheets.walk.t, alphaTest: 0.5, side: THREE.DoubleSide });
const hero = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.0).translate(0, 1.0, 0), heroMat); hero.castShadow = true;
hero.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: sheets.walk.t, alphaTest: 0.5 });
scene.add(hero);
const blob = new THREE.Mesh(new THREE.CircleGeometry(0.45, 16), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.28, depthWrite: false })); blob.rotation.x = -Math.PI / 2; scene.add(blob);
const P = { x: 0, z: 4, dir: 0, walkT: 0, moving: false };

// ---------------------------------------------------------------- caméra
const CAM = { yaw: 0, yawT: 0, dist: 13, distT: 13, pitch: 0.7, fov: 38, aim: false, aimK: 0, look: new THREE.Vector3() };
function rotateCam(s) { CAM.yawT += s * Math.PI / 4; }
// ---------------------------------------------------------------- pluie
const RAIN_N = 1800; const rainGeo = new THREE.BufferGeometry(); const rainPos = new Float32Array(RAIN_N * 6);
for (let i = 0; i < RAIN_N; i++) { const x = (rnd() - 0.5) * 50, y = rnd() * 22, z = (rnd() - 0.5) * 50; rainPos.set([x, y, z, x + 0.05, y - 0.6, z], i * 6); }
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3)); const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: '#cfe4ff', transparent: true, opacity: 0.55 })); rain.visible = false; scene.add(rain);
// ---------------------------------------------------------------- heure du jour
const TIMES = [
  { n: 'Jour', sun: '#fff1d2', si: 2.4, hemi: ['#dfeaff', '#4a5a2a', 0.85], fog: '#cfd8cf', top: '#7fb2e8', bot: '#e9e2c8', az: 0.7, el: 0.95, exp: 1.05 },
  { n: 'Coucher', sun: '#ffab6a', si: 2.0, hemi: ['#ffc8a0', '#3a2a2a', 0.6], fog: '#e8b08a', top: '#5a6aa8', bot: '#ffb87a', az: 1.6, el: 0.32, exp: 1.0 },
  { n: 'Nuit', sun: '#9ab4ff', si: 0.9, hemi: ['#6a7ad0', '#20243a', 0.7], fog: '#1e2840', top: '#0a1024', bot: '#2c3858', az: -0.6, el: 0.8, exp: 1.45 }
];
let TI = 0;
function applyTime() { const T = TIMES[TI]; sun.color.set(T.sun); sun.intensity = T.si; hemi.color.set(T.hemi[0]); hemi.groundColor.set(T.hemi[1]); hemi.intensity = T.hemi[2];
  scene.fog.color.set(T.fog); skyU.top.value.set(T.top); skyU.bot.value.set(T.bot); renderer.toneMappingExposure = T.exp; document.getElementById('bTime').textContent = T.n;
  for (const t of torches) t.l.intensity = TI === 2 ? 5 : TI === 1 ? 3.6 : 3.2; }
applyTime();

// ---------------------------------------------------------------- commandes
const keys = {}; addEventListener('keydown', e => { if (e.repeat) return; keys[e.code] = true; if (e.code === 'KeyQ') rotateCam(-1); if (e.code === 'KeyE') rotateCam(1); });
addEventListener('keyup', e => keys[e.code] = false);
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('mousedown', e => { if (e.button === 2) CAM.aim = true; }); addEventListener('mouseup', e => { if (e.button === 2) CAM.aim = false; });
addEventListener('wheel', e => { CAM.distT = clamp(CAM.distT + Math.sign(e.deltaY) * 1.5, 9, 28); }, { passive: true });
const aimBtn = document.getElementById('aim'); aimBtn.addEventListener('touchstart', e => { CAM.aim = true; e.preventDefault(); }); aimBtn.addEventListener('touchend', e => { CAM.aim = false; e.preventDefault(); });
aimBtn.addEventListener('mousedown', () => CAM.aim = true);
const stick = { on: false, id: null, ox: 0, oy: 0, x: 0, y: 0 }, stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
view.addEventListener('touchstart', e => { for (const t of e.changedTouches) if (!stick.on && t.clientX < innerWidth * 0.55) { Object.assign(stick, { on: true, id: t.identifier, ox: t.clientX, oy: t.clientY, x: 0, y: 0 }); stickEl.style.display = 'block'; stickEl.style.left = (t.clientX - 55) + 'px'; stickEl.style.top = (t.clientY - 55) + 'px'; } e.preventDefault(); }, { passive: false });
view.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (stick.on && t.identifier === stick.id) { let dx = t.clientX - stick.ox, dy = t.clientY - stick.oy; const m = Math.hypot(dx, dy); if (m > 45) { dx *= 45 / m; dy *= 45 / m; } stick.x = dx / 45; stick.y = dy / 45; knob.style.left = (35 + dx) + 'px'; knob.style.top = (35 + dy) + 'px'; } e.preventDefault(); }, { passive: false });
view.addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === stick.id) { stick.on = false; stick.x = stick.y = 0; stickEl.style.display = 'none'; } }, { passive: false });
document.getElementById('bPix').onclick = e => { PIX = !PIX; e.target.classList.toggle('on', PIX); resize(); };
document.getElementById('bTime').onclick = () => { TI = (TI + 1) % TIMES.length; applyTime(); };
document.getElementById('bRain').onclick = e => { rain.visible = !rain.visible; e.target.classList.toggle('on', rain.visible); };
document.getElementById('bRotL').onclick = () => rotateCam(-1); document.getElementById('bRotR').onclick = () => rotateCam(1);
document.getElementById('bQual').onclick = e => { if (QUAL.auto) { QUAL.auto = 0; QUAL.level = 2; } else if (QUAL.level > 0) QUAL.level--; else QUAL.auto = 1; e.target.textContent = 'Qualité : ' + (QUAL.auto ? 'auto' : ['basse', 'moyenne', 'haute'][QUAL.level]); applyQuality(); };
function applyQuality() { grass.count = QUAL.level === 0 ? 0 : QUAL.level === 1 ? Math.floor(grassList.length / 2) : grassList.length; sun.shadow.mapSize.set(QUAL.level === 2 ? 2048 : 1024, QUAL.level === 2 ? 2048 : 1024); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } resize(); }

// ---------------------------------------------------------------- simulation
function blocked(x, z, h0) {
  if (Math.hypot(x, z) > 56) return true;
  if (pond(x, z) < -0.35) return true; // eau profonde
  if (Math.abs(heightAt(x, z) - h0) > 0.45) return true; // falaise (l'escalier est une pente douce)
  for (const c of colliders) if (Math.hypot(c.x - x, c.z - z) < c.r + 0.35) return true;
  return false;
}
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60, lowT = 0;
const tmp = new THREE.Vector3();
window.__demo = { P, CAM, renderer, get fps() { return fps; } };
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  const slow = lerp(1, 0.4, CAM.aimK); const wdt = dt * slow; time.value += wdt;
  // déplacement relatif à la caméra
  // e.code = position physique : WASD couvre aussi ZQSD sur un clavier AZERTY ; KeyQ/KeyE (A/E en AZERTY) tournent la caméra
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  ix += stick.x; iz += stick.y;
  const m = Math.hypot(ix, iz);
  P.moving = m > 0.15;
  if (P.moving) {
    const s = (CAM.aim ? 2.4 : 5.2) * Math.min(1, m) * dt; const cy = Math.cos(CAM.yaw), sy = Math.sin(CAM.yaw);
    const vx = (ix * cy + iz * sy) / m, vz = (-ix * sy + iz * cy) / m; const h0 = heightAt(P.x, P.z);
    if (!blocked(P.x + vx * s, P.z, h0)) P.x += vx * s; if (!blocked(P.x, P.z + vz * s, heightAt(P.x, P.z))) P.z += vz * s;
    // orientation : 4 directions LPC choisies par rapport à la caméra (diagonales -> direction la plus proche)
    if (Math.abs(ix) > Math.abs(iz)) P.dir = ix > 0 ? 3 : 1; else P.dir = iz > 0 ? 2 : 0;
    P.walkT += dt * 10;
  }
  const hy = heightAt(P.x, P.z); hero.position.set(P.x, hy, P.z); blob.position.set(P.x, hy + 0.03, P.z);
  const sh = P.moving ? sheets.walk : sheets.idle; if (heroMat.map !== sh.t) { heroMat.map = sh.t; hero.customDepthMaterial.map = sh.t; heroMat.needsUpdate = true; hero.customDepthMaterial.needsUpdate = true; }
  const fr = P.moving ? 1 + Math.floor(P.walkT) % 8 : Math.floor(now / 500) % 2; sh.t.offset.set(fr / sh.cols, 1 - (P.dir + 1) / 4);
  // caméra : suivi fluide, rotation par crans, visée immersive (rapprochement, champ réduit, ralenti)
  CAM.aimK = lerp(CAM.aimK, CAM.aim ? 1 : 0, 1 - Math.pow(0.001, dt));
  CAM.yaw = lerp(CAM.yaw, CAM.yawT, 1 - Math.pow(0.002, dt)); CAM.dist = lerp(CAM.dist, CAM.distT, 1 - Math.pow(0.01, dt));
  const dist = lerp(CAM.dist, 8.5, CAM.aimK), pitch = lerp(CAM.pitch, 0.62, CAM.aimK); camera.fov = lerp(CAM.fov, 30, CAM.aimK); camera.updateProjectionMatrix();
  tmp.set(P.x, hy + 1.2 + CAM.aimK * 0.4, P.z); CAM.look.lerp(tmp, 1 - Math.pow(0.0005, dt));
  camera.position.set(CAM.look.x + Math.sin(CAM.yaw) * Math.cos(pitch) * dist, CAM.look.y + Math.sin(pitch) * dist, CAM.look.z + Math.cos(CAM.yaw) * Math.cos(pitch) * dist);
  camera.lookAt(CAM.look);
  // le panneau du personnage reste vertical et face à la caméra
  hero.rotation.y = CAM.yaw;
  document.getElementById('reticle').style.display = CAM.aimK > 0.5 ? 'block' : 'none';
  // soleil qui suit le joueur (ombres nettes autour de lui seulement)
  const T = TIMES[TI]; sun.position.set(P.x + Math.cos(T.az) * 40 * Math.cos(T.el), hy + Math.sin(T.el) * 40, P.z + Math.sin(T.az) * 40 * Math.cos(T.el)); sun.target.position.set(P.x, hy, P.z);
  sky.position.copy(camera.position);
  // découpe des feuillages devant le joueur
  tmp.set(P.x, hy + 1, P.z).project(camera); playerScreen.value.set(tmp.x * 0.5 + 0.5, tmp.y * 0.5 + 0.5); playerDepth.value = tmp.z * 0.5 + 0.5;
  const sz = new THREE.Vector2(); renderer.getSize(sz); resU.value.copy(sz);
  // vie du monde : torches, eau, pluie
  for (const t of torches) { const k = 0.85 + Math.sin(now * 0.017 + t.l.position.x) * 0.1 + Math.random() * 0.05; t.l.intensity = (TI === 2 ? 5 : 3.2) * k; t.f.scale.setScalar(k); }
  water.material.opacity = 0.74 + Math.sin(now * 0.001) * 0.04;
  if (rain.visible) { rain.position.set(P.x, hy, P.z); const a = rainGeo.attributes.position.array; for (let i = 0; i < RAIN_N; i++) { a[i * 6 + 1] -= 26 * wdt; a[i * 6 + 4] -= 26 * wdt; if (a[i * 6 + 4] < -2) { a[i * 6 + 1] += 24; a[i * 6 + 4] += 24; } } rainGeo.attributes.position.needsUpdate = true; }
  renderer.render(scene, camera);
  // images par seconde et qualité automatique
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; document.getElementById('fps').textContent = fps + ' i/s · ' + (PIX ? 'pixel 3D' : 'lisse') + ' · ' + ['basse', 'moyenne', 'haute'][QUAL.level];
    if (QUAL.auto) { if (fps < 40) lowT++; else lowT = Math.max(0, lowT - 1); if (lowT >= 4 && QUAL.level > 0) { QUAL.level--; lowT = 0; applyQuality(); } } }
}
resize(); requestAnimationFrame(frame);
</script>
