<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vélorne">

<title>Vélorne — jeu 3D (socle en construction)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0c0a14;overflow:hidden;color:#efe3c8;font-family:'Trebuchet MS',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;position:relative;z-index:1}
#view{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none;image-rendering:pixelated}
body.v3d #view{display:block}
body.v3d #wrap{pointer-events:auto}
#v3dinfo{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);font-size:10px;opacity:.6;z-index:30;pointer-events:none;display:none}
body.v3d #v3dinfo{display:block}
#cam3d{position:fixed;right:max(8px,env(safe-area-inset-right));top:46%;transform:translateY(-50%);z-index:25;display:none;flex-direction:column;gap:4px}
body.v3d #cam3d.on{display:flex}
#cam3d button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,233,160,.35);background:rgba(18,12,28,.55);color:#ffe9a0;font-size:15px;line-height:1;padding:0;touch-action:none;cursor:pointer}
#cam3d button:active{background:rgba(80,60,120,.7)}
body.v3d.paused #cam3d{display:none}
@media (max-height:460px){#cam3d{top:103px;transform:none;gap:2px}#cam3d button{width:22px;height:22px;font-size:12px;border-radius:6px}}
#camstick{position:fixed;width:100px;height:100px;margin:0;border-radius:50%;border:2px solid rgba(160,200,255,.45);background:rgba(20,30,50,.25);z-index:11;display:none;pointer-events:none}
#camstick>div{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(170,210,255,.55);border:2px solid rgba(220,235,255,.8)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
.ov.show{display:flex}
#loading{background:#0c0a14;flex-direction:column;gap:14px}
#loading .lb{width:240px;height:8px;border:1px solid #c9a45a;background:#1a1424}
#loadbar{height:100%;width:0;background:linear-gradient(90deg,#c9a45a,#ffe27a)}
#title{flex-direction:column;gap:10px;background:radial-gradient(ellipse at center,rgba(12,10,20,.2),rgba(12,10,20,.75))}
button{font-family:inherit;cursor:pointer}
.big{min-width:240px;padding:12px 22px;font-size:17px;border:2px solid #c9a45a;background:linear-gradient(#3a2a1a,#241810);color:#ffe9c0;border-radius:6px;box-shadow:0 3px 0 #120a06,inset 0 1px 0 rgba(255,230,160,.25)}
.big:active{transform:translateY(2px)}
/* créateur */
#creator{background:rgba(8,6,16,.88)}
.crbox{background:linear-gradient(#211a2c,#15101d);border:2px solid #c9a45a;border-radius:10px;padding:14px 18px;max-width:760px;width:94vw;max-height:94vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.crbox h2{font-family:Georgia,serif;color:#ffe9c0}
.crgrid{display:flex;gap:16px;width:100%;align-items:flex-start}
.crprev{display:flex;flex-direction:column;align-items:center;gap:8px}
#crview{width:192px;height:192px;image-rendering:pixelated;background:radial-gradient(#3a5a2a,#1c2a16);border:2px solid #6a5a3a;border-radius:8px}
#crname{width:192px;padding:8px;background:#120c18;border:1px solid #6a5a3a;color:#ffe9c0;border-radius:4px;font-size:15px;text-align:center}
.cropts{flex:1;display:flex;flex-direction:column;gap:4px}
.cropts label{font-size:12px;color:#c9b080;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.sw{min-width:34px;height:30px;border:2px solid #4a3a2a;border-radius:5px;color:#efe3c8;font-size:12px;padding:0 8px;background:#2a2238}
.sw.on{border-color:#ffe27a;box-shadow:0 0 0 2px rgba(255,226,122,.35)}
/* HUD boutons */
#hudbtns{position:fixed;top:8px;left:8px;display:none;gap:8px;z-index:12}
#hudbtns.show{display:flex}
#hudbtns button{width:42px;height:36px;border:2px solid #c9a45a;border-radius:8px;background:rgba(20,14,26,.8);color:#ffe9c0;font-size:18px}
/* tactile */
#touch{position:fixed;inset:0;z-index:10;display:none;touch-action:none}
#touch.show{display:block}
#stickzone{position:absolute;left:0;top:0;width:50%;height:100%}
#stickbase{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,233,192,.35);background:rgba(20,14,26,.25);display:none;pointer-events:none}
#stickknob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,233,192,.5);border:2px solid rgba(255,233,192,.8)}
.tbtn{position:absolute;border-radius:50%;border:2px solid rgba(201,164,90,.9);background:rgba(20,14,26,.55) center/62% no-repeat;display:flex;align-items:center;justify-content:center;color:#ffe9c0;font-size:26px;overflow:hidden;image-rendering:pixelated;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tbtn span{pointer-events:none;text-shadow:0 2px 0 #000}
.tbtn.down{background-color:rgba(255,226,122,.35);transform:scale(.94)}
.tb-attack{font-size:38px;background-color:rgba(60,20,20,.6)}
.tb-ult{border-color:#ffcf5a}
.tb-ult.ready{box-shadow:0 0 14px 4px rgba(255,210,90,.75);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px 8px rgba(255,210,90,.95)}}
.tbtn .cd{position:absolute;inset:0;pointer-events:none;background:conic-gradient(rgba(0,0,0,.65) calc(var(--k,0)*360deg),transparent 0)}
.tbtn.nomana{filter:saturate(.3) brightness(.7)}
.tb-potion i{width:32px;height:32px;display:block;transform:scale(1.1);image-rendering:pixelated}
.tb-potion .cnt{position:absolute;right:6px;bottom:2px;font-size:13px;text-shadow:0 1px 0 #000}
.tb-interact.hide{display:none}
.tb-interact.show{animation:pulse 1s infinite;border-color:#ffe27a}
#editbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:30;display:none}
#editbar.show{display:block}
/* panneaux */
.panel{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(6,4,12,.6)}
.panel.show{display:flex}
.panel.menu>*,.panel .pbody{}
.panel.menu{flex-direction:column}
.ptabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:min(860px,96vw);background:#1a1322;border:2px solid #c9a45a;border-bottom:none;border-radius:10px 10px 0 0;padding:6px;align-items:center}
.ptabs button{flex:none;padding:7px 10px;border:1px solid #5a4a30;background:#251c2e;color:#d9c9a0;border-radius:5px;font-size:14px}
.ptabs button.on{background:#4a3a20;color:#ffe9c0;border-color:#c9a45a}
.ptabs .x{margin-left:auto;font-size:16px}
.ptabs .gold{margin-left:auto;color:#ffd23f;font-weight:bold;padding:0 8px;white-space:nowrap;font-size:13px}.ptabs .cap{margin-left:0;white-space:nowrap}.ptabs .gold~.x{margin-left:0}
.pbody{width:min(860px,96vw);max-height:78vh;overflow:auto;background:linear-gradient(#1d1626,#130e19);border:2px solid #c9a45a;border-top:1px solid #5a4a30;border-radius:0 0 10px 10px;padding:12px}
.perso{display:flex;gap:14px;flex-wrap:wrap}
.pv{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:200px}
#pview{width:192px;height:192px;image-rendering:pixelated;background:radial-gradient(#3a5a2a,#1c2a16);border:2px solid #6a5a3a;border-radius:8px}
.pname{font-weight:bold;color:#ffe9c0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13px;color:#c9b890}
.stats b{color:#fff}
.slots{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:280px}
.slot{display:flex;gap:8px;align-items:center;background:#241b2c;border:1px solid #4a3a2a;border-radius:6px;padding:5px;cursor:pointer}
.slot.empty{opacity:.55}
.slot i,.cell i,.srow i{width:32px;height:32px;flex:none;image-rendering:pixelated;display:block}
.slot small{display:block;font-size:10px;color:#9a8a6a}
.slot b{font-size:13px}
.slot span{display:block;font-size:10px;color:#a9c9a0}
.hint{font-size:12px;color:#9a8a6a;margin-top:8px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cell{position:relative;height:52px;border:2px solid;border-radius:6px;background:#241b2c;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell i{transform:scale(1.2)}
.cell b{position:absolute;right:3px;bottom:1px;font-size:12px}
.info{margin-top:10px;padding:10px;background:#241b2c;border-radius:6px;font-size:13px;min-height:60px}
.info p{margin:4px 0 8px;color:#c9b890}
.info button,.dopts button,.srow button,.opts button,.center button,.keys button{padding:8px 14px;border:1px solid #c9a45a;background:#3a2a1a;color:#ffe9c0;border-radius:5px;font-size:14px}
.srow button:disabled{opacity:.4}
.skills .sk{display:flex;gap:10px;align-items:flex-start;padding:8px;border-bottom:1px solid #2e2438}
.skills img{width:40px;height:40px;image-rendering:pixelated;border:1px solid #6a5a3a;border-radius:4px}
.skills p{font-size:13px;color:#c9b890;margin-top:3px}
.skills small{color:#9a8a6a}
.q{padding:8px;border-left:3px solid #c9a45a;background:#211a29;margin-bottom:8px}
.q.done{opacity:.6;border-color:#5a9a5a}
.q p{font-size:13px;color:#c9b890}
.opts h4{margin:12px 0 6px;color:#ffe9c0}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px}
.keys div{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.keys button{min-width:110px;padding:5px 8px}
.shop .srow{display:flex;gap:10px;align-items:center;padding:6px;border-bottom:1px solid #2e2438}
.srow div{flex:1}.srow small{display:block;font-size:11px;color:#a9c9a0}
.credits{font-size:12px;color:#c9b890}.credits p{margin-bottom:10px}
.cr{padding:5px 0;border-bottom:1px solid #2a2232}.cr small{color:#8a7a5a;word-break:break-all}
.cr pre{white-space:pre-wrap;font-size:10px;color:#8a7a5a;max-height:80px;overflow:auto}
.panel.dialog{align-items:flex-end;background:rgba(6,4,12,.25)}
.dlg{width:min(760px,96vw);margin-bottom:12px;background:linear-gradient(#211a2c,#15101d);border:2px solid #c9a45a;border-radius:10px;padding:12px 14px}
.dname{color:#ffe27a;font-weight:bold;margin-bottom:6px}
.dtext{font-size:15px;line-height:1.45;color:#efe3c8}
.dopts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.panel.dead{background:rgba(40,0,0,.6)}
.center{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.center h2{font-family:Georgia,serif;font-size:34px;color:#ffb0a0}
#rotate{background:#0c0a14;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:40}
@media (max-height:520px){.crbox{padding:8px 12px;gap:6px}.crbox h2{font-size:18px}#crview{width:120px;height:120px}#crname{width:120px;padding:5px;font-size:13px}.cropts label{margin-top:1px;font-size:11px}.sw{height:26px;min-width:28px;font-size:11px}.crbox .big{padding:8px 18px;font-size:15px}.pbody{max-height:70vh}}

/* Partie 5 */
.ic{width:32px;height:32px;flex:none;image-rendering:pixelated;display:inline-block;vertical-align:middle}
.ic.icb{transform:scale(1.5);margin:8px}
.ic.q{background:#1a1420;color:#555;text-align:center;line-height:32px;font-weight:bold}
.rb{font-size:11px;font-weight:bold}.rk{display:inline-block;margin-left:4px;padding:0 5px;border-radius:3px;background:linear-gradient(#ff3860,#a01030);color:#fff;font-size:10px;font-weight:bold}
.cell u{position:absolute;left:3px;top:1px;font-size:10px;text-decoration:none;color:#9fe3ff}
.cell em{position:absolute;left:3px;bottom:1px;font-size:10px;font-style:normal;color:#7ee06b;font-weight:bold}
.cell s{position:absolute;right:2px;top:0;font-size:10px;text-decoration:none}
.cell q,.cc q{position:absolute;right:3px;top:1px;font-size:11px;color:#ff3860;font-weight:bold}
.cell.r5{box-shadow:inset 0 0 10px rgba(255,180,60,.35)}.cell.r6,.cell.rS{box-shadow:inset 0 0 12px rgba(255,60,110,.45);animation:glowS 2s infinite}
@keyframes glowS{50%{box-shadow:inset 0 0 18px rgba(255,90,140,.7)}}
.invbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cats{display:flex;gap:4px;flex-wrap:wrap}.cats button,.row button,.acts button,.spinbtns button,.stylebox button,#isort{padding:6px 10px;border:1px solid #5a4a30;background:#251c2e;color:#d9c9a0;border-radius:5px;font-size:13px}
.cats button.on,.row button.on{background:#4a3a20;color:#ffe9c0;border-color:#c9a45a}
.cap{color:#9fe3ff;font-size:13px;margin-left:auto;padding:0 6px}
.invwrap{display:flex;gap:10px}.invwrap .inv{flex:1;align-content:start}
.detail{width:46%;min-width:260px;background:#211a29;border-radius:6px;padding:8px;font-size:13px;align-self:flex-start}
.dh{display:flex;gap:10px;align-items:center}.dh b{font-size:15px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:6px 0;color:#c9b890;font-size:12px}.rows b{color:#fff}
.eff p{margin:3px 0;color:#d9c9a0;font-size:12px}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts button{border-color:#c9a45a;color:#ffe9c0;background:#3a2a1a}
.cmp{margin-top:6px;background:#17111d;border-radius:5px;padding:6px}.cmp table{width:100%;font-size:11px;border-collapse:collapse}.cmp td,.cmp th{padding:2px 4px;text-align:left}.cmp th{color:#9a8a6a;font-weight:normal}
.up{color:#7ee06b}.down{color:#ff7a6a}.okc{color:#7ee06b}.koc{color:#ffb36b}.dim{color:#6a5e50}
.cmpe{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}.cmpe small{color:#9a8a6a}.cmpe p{font-size:11px;margin:2px 0}
.fiche h3{font-family:Georgia,serif}.fiche h4{margin:10px 0 3px;color:#ffe9c0;font-size:14px}.fiche p{font-size:13px;color:#d9c9a0;margin:2px 0}.lore{font-style:italic;color:#c9b080!important}
.mbar{height:8px;background:#2a2035;border-radius:4px;overflow:hidden;margin:4px 0}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#b57bff,#ffe27a)}
.unl{list-style:none;font-size:12px;margin-top:4px}
.pcol{flex:1;min-width:300px;display:flex;flex-direction:column;gap:8px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px;color:#c9b890}.stats2 b{color:#fff}
.resrow{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#9a8a6a}.resrow b{color:#e9e0c8}
.sets p{font-size:12px;margin:2px 0}.stylebox{font-size:12px;text-align:center;color:#c9b890;line-height:1.6}
.slot .dur{color:#ffb36b}
.styles .stl{display:flex;gap:10px;padding:8px;border:1px solid #3a2e44;border-radius:6px;margin-bottom:6px;cursor:pointer}.styles .stl.on{border-color:#ffe27a;background:#2a2234}.styles p{font-size:12px;color:#c9b890}
.collec{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:6px}
.cc{position:relative;display:flex;gap:6px;align-items:center;border:1px solid;border-radius:5px;padding:4px;font-size:11px;background:#211a29;cursor:pointer}.cc.unk{opacity:.5;cursor:default}
.lorelist p{padding:8px;border-left:3px solid #c9a45a;background:#211a29;margin-bottom:6px;font-size:13px;font-style:italic}
.hist .hrow{display:flex;gap:8px;align-items:center;padding:4px;border-bottom:1px solid #2a2232;font-size:13px}.hrow small{margin-left:auto;color:#8a7a5a;font-size:11px}
.srow{display:flex;gap:10px;align-items:center;padding:6px;border-bottom:1px solid #2e2438}.srow.unk{opacity:.7}
.stashw{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stashw h4{color:#ffe9c0;margin-bottom:6px}
.spinhead{display:flex;gap:12px;align-items:center}.spinhead canvas{width:320px;height:150px;background:radial-gradient(#2a1e10,#0e0a06);border:1px solid #6a5a3a;border-radius:8px;flex:none}
.spinhead.exceptional canvas{background:radial-gradient(#2a0e1e,#0b0614);border-color:#ff5d8f}.spinhead p{font-size:12px;color:#c9b890;margin:4px 0}
.spinbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}.spinbtns .big{min-width:180px;font-size:14px;padding:10px 14px}.spinbtns button:disabled{opacity:.4}
.rateg{margin-bottom:8px}.rateg>div{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;margin-top:3px}.rateg span{display:flex;align-items:center;gap:3px}
.spinanim{position:relative}.spinanim canvas{width:min(92vw,820px);aspect-ratio:16/9;image-rendering:pixelated;border:2px solid #c9a45a;border-radius:10px}
.spinanim.exceptional canvas{border-color:#ff5d8f}.skip{position:absolute;right:10px;bottom:10px;padding:8px 14px;border:1px solid #c9a45a;background:rgba(20,14,26,.8);color:#ffe9c0;border-radius:5px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.resc{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid;border-radius:8px;padding:8px;background:#211a29;text-align:center;font-size:12px;animation:pop .35s}
.resc.r6{box-shadow:0 0 18px rgba(255,60,110,.6)}@keyframes pop{from{transform:scale(.6);opacity:0}}
.crdesc{font-size:11px;color:#a99a7a}
.tb-tech{border-color:#f0d08a}.tb-awaken{border-color:#ff5d8f}.tb-awaken.ready{box-shadow:0 0 14px 4px rgba(255,93,143,.75);animation:pulse 1s infinite}.tb-awaken.hide,.tb-relic.hide,.tb-mount.hide{display:none}
@media (max-height:520px){.pbody{padding:8px}.detail{min-width:220px}.spinhead canvas{width:220px;height:103px}.ptabs button{padding:5px 8px;font-size:12px}.spinanim canvas{width:auto;height:82vh}}

/* ===== Refonte : accueil, création, rituel ===== */
@font-face{font-family:Velorne;src:local('Cinzel'),local('Trajan Pro'),local('Georgia')}
.ov{transition:opacity .35s}
#fader{position:fixed;inset:0;background:#06030e;opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}
#fader.on{opacity:1}
#title{justify-content:flex-start;background:none;flex-direction:row}
#title .tleft{height:100%;width:min(44vw,520px);display:flex;flex-direction:column;justify-content:center;gap:2.2vh;padding:0 4vw;animation:tin .9s ease-out}
@keyframes tin{from{opacity:0;transform:translateX(-30px)}}
.logo{text-align:center}
.logo h1{font-family:Velorne,Georgia,serif;font-size:clamp(30px,5.4vw,68px);letter-spacing:.1em;white-space:nowrap;line-height:1;background:linear-gradient(#fff6d8 10%,#f1c96a 45%,#a8701e 75%,#ffe7a3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a210a) drop-shadow(0 0 18px rgba(255,190,90,.45));animation:glowt 4s ease-in-out infinite}
@keyframes glowt{50%{filter:drop-shadow(0 3px 0 #3a210a) drop-shadow(0 0 30px rgba(255,200,110,.75))}}
.logo h3{font-family:Georgia,serif;font-style:italic;font-weight:normal;color:#e8d6ae;letter-spacing:.12em;font-size:clamp(13px,1.8vw,19px);margin-top:4px}
.orn{color:#c9a45a;letter-spacing:.2em;font-size:12px;opacity:.85}

        any = true; let a = PAD_MAP[i];
        if (i === 0 && inPlay && G.near) a = 'interact';
        PAD.held[i] = a; press(a);
        if (a === 'menu' || a === 'inventory') document.dispatchEvent(new CustomEvent('padmenu', { detail: a }));
      } else if (!on && was) { if (PAD.held[i]) release(PAD.held[i]); PAD.held[i] = null; }
      PAD.prev[i] = on;
    }
    if (any) setPadMode(true);
  };
})();
</script>

<script>
// Safari (iPhone) : images chargées en mode partage autorisé, sinon Safari peut les considérer comme venant d'un autre site
// et interdire leur lecture (« The operation is insecure ») : création du héros et textures 3D bloquées. En cas d'échec, nouvel essai normal.
loadImage = function (path) {
  if (IMG[path]) return IMG[path].p;
  const im = new Image(); im.crossOrigin = 'anonymous';
  const p = new Promise(res => { im.onload = () => res(im); im.onerror = () => { const im2 = new Image(); im2.onload = () => { IMG[path].im = im2; res(im2); }; im2.onerror = () => { console.warn('img fail', path); res(im2); }; im2.src = 'assets/' + path; }; });
  im.src = 'assets/' + path; IMG[path] = { im, p }; return p;
};
</script>
