<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Vélorne — prototype 3D v4 · village pilote de Brumeval</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden;font-family:Georgia,'Trebuchet MS',serif;color:#f3ead2;touch-action:none;user-select:none;-webkit-user-select:none}
  #view{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #hud{position:fixed;left:10px;top:8px;font-size:13px;text-shadow:0 1px 2px #000,0 0 6px #000;pointer-events:none;line-height:1.45}
  #hud b{color:#ffe7a0;font-size:15px;letter-spacing:.5px}
  #hud span{opacity:.85;font-style:italic}
  #fps{position:fixed;left:10px;bottom:6px;font-size:10px;opacity:.5;pointer-events:none}
  #bar{position:fixed;right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
  #bar button,#jBtn{background:rgba(20,14,28,.72);color:#f3ead2;border:1px solid #c9a45a88;border-radius:8px;padding:6px 9px;font-size:12px;font-family:inherit}
  #bar button.on{background:#c9a45a;color:#1a120a}
  #bar.fold button:not(#bGear){display:none}
  #jBtn{position:fixed;left:10px;top:54px}
  #radar{position:fixed;right:10px;top:48px;width:96px;height:96px;border-radius:50%;border:2px solid #c9a45a88;pointer-events:none}
  #prompt{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(18,12,24,.78);border:1px solid #c9a45a99;border-radius:20px;padding:5px 14px;font-size:13px;display:none;pointer-events:none;white-space:nowrap}
  #act{position:fixed;right:22px;bottom:24px;width:78px;height:78px;border-radius:50%;background:rgba(20,14,28,.6);border:2px solid #c9a45aaa;color:#ffe7a0;font-size:14px;display:none;align-items:center;justify-content:center;font-family:inherit}
  @media (pointer:coarse){#act{display:flex}#help{display:none}}
  #dlg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(600px,90vw);background:linear-gradient(rgba(28,20,34,.94),rgba(18,12,24,.94));border:1px solid #c9a45a;border-radius:10px;padding:12px 16px;display:none;font-size:15px;line-height:1.5;box-shadow:0 4px 18px #000a}
  #dlg b{color:#ffe7a0}
  #dlg small{display:block;text-align:right;opacity:.55;margin-top:4px;font-size:11px}
  #dlg .ch{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  #dlg .ch button{background:#2a2034;color:#f3ead2;border:1px solid #c9a45a88;border-radius:6px;padding:7px;font-family:inherit;font-size:14px;text-align:left}
  #stick{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid #ffffff55;display:none;pointer-events:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffff66}
  #help{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;font-size:11px;opacity:.65;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap}
  #banner{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(18,12,24,.85);border:1px solid #c9a45a;border-radius:8px;padding:8px 16px;font-size:14px;color:#ffe7a0;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center;max-width:86vw}
  #journal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);max-height:80vh;overflow:auto;background:rgba(22,16,28,.96);border:1px solid #c9a45a;border-radius:10px;padding:14px 18px;display:none;font-size:13px}
  #journal h3{margin:6px 0;color:#ffe7a0;font-weight:normal;letter-spacing:.5px}
  #journal ul{list-style:none;padding:0;margin:0}
  #journal li{padding:5px 0;border-bottom:1px solid #ffffff14;opacity:.75}
  #journal li.ok{opacity:1;color:#d8f0b0}
  #journal i{font-size:11px;opacity:.6}
  #journal button{margin-top:10px;background:#2a2034;color:#f3ead2;border:1px solid #c9a45a88;border-radius:6px;padding:6px 12px;font-family:inherit}
  #bubbles{position:fixed;inset:0;pointer-events:none}
  .bub{position:absolute;transform:translate(-50%,-100%);background:#fbf3df;color:#2a1e14;border-radius:8px;padding:3px 8px;font-size:12px;white-space:nowrap;box-shadow:0 2px 4px #0006}
  .bub:after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fbf3df;border-bottom:0}
  #proto{position:fixed;left:50%;top:8px;transform:translateX(-50%);font-size:10px;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:6px;pointer-events:none;opacity:.8}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0a10;font-size:16px;color:#ffe7a0;letter-spacing:1px}
  @media (max-width:600px){#proto{display:none}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<button id="jBtn">Secrets</button>
<div id="fps"></div>
<div id="proto">Prototype 3D v4 indépendant — le jeu et ses sauvegardes ne sont pas concernés</div>
<div id="bar" class="fold">
  <button id="bGear">⚙</button>
  <button id="bPix" class="on">Pixel 3D</button>
  <button id="bTime">+2 h</button>
  <button id="bSpeed">Temps ×1</button>
  <button id="bRotL">⟲</button><button id="bRotR">⟳</button>
  <button id="bUp">Angle ▲</button><button id="bDn">Angle ▼</button>
  <button id="bQual">Qualité : auto</button>
  <button id="bJournal">Journal</button>
  <button id="bReset">Réinitialiser la démo</button>
  <button onclick="location.href='jeu-2d.html'">Ancien jeu 2D</button>
  <button onclick="location.href='demo3d-v3.html'">Ancienne v3</button>
</div>
<canvas id="radar" width="96" height="96"></canvas>
<div id="bubbles"></div>
<div id="prompt"></div>
<button id="act">Action</button>
<div id="dlg"></div>
<div id="banner"></div>
<div id="journal"></div>
<div id="stick"><div id="knob"></div></div>
<div id="help">ZQSD / flèches : marcher · Maj : courir · E / Espace : agir · A / R : tourner la caméra · T / G : angle · molette : zoom · J : journal</div>
<div id="loading">Brumeval s'éveille…</div>
<script type="module" src="assets/demo/v4/main.js"></script>
</body>
</html>
